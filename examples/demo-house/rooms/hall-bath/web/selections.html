<script>
const MD = "# Selections: Hall bath\n\nEvery product, finish and idea for this room: what's chosen, what's still open, what was\nconsidered and passed on, and suggestions not yet decided. Updated whenever a link is\nshared, an option is rendered, or something is picked.\n\nStatus: **idea** (suggested, nobody's looked yet) \u00b7 **considering** (options on the table) \u00b7\n**chosen** \u00b7 **ordered** \u00b7 **installed** \u00b7 **existing** (already there, staying).\nPrices as seen on 2026-10-29.\n\n## Open decisions\n\n- Faucet: any 4\" centerset in satin nickel, to match the vanity's knobs.\n- Switches: there's no wall inside on the door's latch side, so the lighting review puts the\n  3-gang box (two dimmers and a fan timer) in the hall at the latch side, 48\" up. Confirm.\n- Heat: no register or radiator is modeled. Find where the heat comes from today and add it.\n- Tub valve access: the old access panel behind the sink goes away with the vanity. The Delta\n  valve services from the front (the cartridge comes out through the escutcheon); keep a panel\n  only if the shutoffs are behind the wall.\n\n---\n\n## Wall tile\n\n![Cloe tile](intake/products/bedrosians-cloe-overhead.jpg)\n\n**Status:** chosen (2026-10-29)\n\n- **Bedrosians Cloe 2.5\" x 8\" glossy ceramic, Green.** About $8.29/sq ft (DesignShop), 10.64\n  sq ft and 76 pieces per carton. Hand-made look, with uneven edges and shade variation.\n  Running bond to 54\" on the room walls and to 84\" around the tub.\n  - Link: https://allseasonamericanflooring.com/products/bedrosians-cloe-2-5-x-8-ceramic-wall-tile\n  - Amount: about 100 sq ft with waste, so 10 cartons (about $880).\n  - Saved: `intake/products/bedrosians-cloe-green-2.5x8.jpg`\n  - Rendered: `renders/options/tile/` (`compare.jpg`)\n\n**Considered:**\n- Cloe Baby Blue: pretty, but pale enough that the room read as all white in the renders.\n- Cloe Pink: a fun nod to 1950s baths, and too sweet next to the gray vanity.\n- Cloe Creme (`bedrosians-cloe-creme-2.5x8.jpg`): too close to the walls to bother rendering.\n\n**Notes:** green picked to keep the room's original color, in a deeper, glossier tile.\n\n## Floor\n\n**Status:** chosen\n\n- **Merola Tile Classico Carrara Hexagon 7\" x 8\" porcelain, FEQCRX.** About $11.18/sq ft (Home\n  Depot), 7.5 sq ft per case.\n  - Link: https://www.homedepot.com/p/Merola-Tile-Classico-Carrara-Hexagon-7-in-x-8-in-Porcelain-Floor-and-Wall-Tile-7-5-sq-ft-Case-FEQCRX/300637966\n  - Amount: 31.5 sq ft plus waste, so 5 cases (about $420).\n  - Texture: `textures/carrara_hex.jpg` (generated: 7x8 hexes with Carrara veining, one 84\"\n    repeat).\n\n## Vanity\n\n**Status:** chosen (2026-10-29, replacing the Highgate after the checker's review)\n\n- **Glacier Bay Shaila 30.5\" vanity, Silverleaf, PPSOFSVL30.** About $293 (Home Depot, price to\n  confirm).\n  - Link: https://www.homedepot.com/p/205428762\n  - Specs: 30.5\" W x 16.25\" D x 35.06\" H, white cultured-marble top with an integrated sink.\n    Modeled with the generic shaker vanity at those sizes.\n  - Why: the door swings in, hinged on the far jamb, and its latch edge sweeps 27-3/4\" around\n    the hinge. An 18.75\"-deep vanity stood 1.2\" into the door opening and blocked the swing; at\n    16.25\" its front is at 16-5/8\", clear of the 18\" jamb.\n  - Fit: the sink bay is 31-1/8\" (FROM PHOTO), leaving about 1/4\" at the stub wall.\n\n**Considered:**\n- Glacier Bay Highgate 30\" Pearl Gray, GB30P2-PG ($241, GoSource): the first pick, and the one\n  in the demo video. At 18.75\" deep it stands in the door opening (found by the `checker`).\n  Saved: `intake/products/glacier-bay-highgate-30-pearl-gray.jpg`, `-dims.jpg`.\n- Glacier Bay 24\" Pearl Gray, GB24P2-PG (24.2\" x 18.8\"): pushed against the stub wall, its corner\n  still sits in the door's swing by about 1/4\".\n\n## Mirror\n\n**Status:** chosen\n\n- **Gatco Designer 5079LG frameless beveled oval mirror, 24\" x 32\".** About $123.\n  - Link: https://build.com/gatco-5079lg/s1145297\n  - Hung with its center at 58\", over the vanity.\n\n**Considered:**\n- Keeping a medicine cabinet: the old one is surface-mounted; a recessed one needs the wall\n  opened. The oval suits the curved tile better.\n\n## Toilet\n\n**Status:** chosen\n\n- **Kohler Cimarron K-3851, two-piece round-front, 1.28 gpf, white.**\n  - Link: https://build.com/kohler-k-3851-u/s561268\n  - Spec sheet: https://techcomm.kohler.com/techcomm/pdf/K-3851_spec_US-CA_Kohler_en.pdf\n  - Specs: 30-1/2\" deep, 27-1/4\" to the tank top, 16-1/2\" rim, 10\" rough-in.\n\n**Considered:**\n- Elongated bowls (Cimarron K-31648): 2\" deeper, and the doorway side is already tight.\n\n## Lighting, fan and switches\n\n**Status:** chosen (2026-10-29, from a lighting designer's review: the `trades` agent)\n\nThe room had one light over the mirror and nothing else; the evening renders went dark past the\nvanity. The review's plan: three wet-rated wafers, a real bar over the mirror, a quiet fan over\nthe tub, all 2700 K and CRI 90+, on dimmers.\n\n- **Halo HLB4LSFS5 4\" canless LED wafer, x3.** About $25 each ($90 for a 4-pack), Home Depot.\n  Selectable 2700\u20135000 K (set to 2700) and lumens (set to about 600); wet-location listed.\n  - Link: https://homedepot.com/p/332661944\n  - Spec: https://www.cooperlighting.com/global/brands/halo/12015789/hlb-slim-low-glare-canless-led-downlights/hlb4lsfs5\n  - Where: over the tub (15, -42), over the toilet (48, -30), at the entry (42, -74). About 44\"\n    apart, none over the mirror. The two near the tub are in the code's wet/damp zone.\n- **Kichler 5337NIS 24\" three-light vanity bar, brushed nickel, satin etched glass.** About $63.\n  - Link: https://www.kichler.com/sku/5337NIS\n  - Specs: 24\" W x 8\" H, 8\" extension, 3 x A19 (use 800 lm, 2700 K, CRI 90+), damp-rated.\n  - Where: centered over the mirror, bottom at 77\" (3\" above the mirror). The 31-1/2\" sink bay\n    is too tight for sconces beside a 24\" mirror.\n- **Panasonic WhisperCeiling DC FV-0511VQ1 exhaust fan.** About $150\u2013180.\n  - Link: https://jacksonsystems.com/product/panasonic-ventilation-fv-0511vq1/\n  - Specs: 50/80/110 CFM selectable (set to 80 for duct losses; the room needs 50), under 0.3\n    sone, 4\" duct to the outside, rated over a tub on a GFCI circuit.\n  - Where: over the tub at (15, -12), near the exterior north wall.\n- **Lutron Diva DVCL-153P dimmers, x2** (cans, vanity bar), about $28 each, and a **Lutron\n  Maestro MA-T51MN countdown timer** for the fan, about $40.\n- **GFCI receptacle** moved to the south end of the backsplash, the far side from the tub (it\n  was within 3 ft of the tub). One 20 A GFCI circuit for the room.\n\nMaterials: about $375\u2013425. Before ordering: check what's above the ceiling and which way the\njoists run (the cans may shift 3\" to miss one).\n\n**Considered:**\n- Sconces either side of the mirror: no room (3-1/2\" each side in the bay).\n- A fan just outside the curtain at (40, -14): fine if the inspector doesn't want one over the tub.\n\n## Paint\n\n**Status:** chosen\n\n- **Warm white** above the tile (`warmwhite` in `lib/roomkit/materials.py`): any warm white\n  eggshell. Lets the green carry the room.\n\n## Tub\n\n**Status:** existing\n\n- The 60\" x 30\" alcove tub stays, with a new cream curtain on the existing rod, moved in over\n  the rim's inner edge so the hem hangs inside the tub (the old one stopped 5\" above the rim).\n\n## Tub and shower trim\n\n**Status:** chosen (2026-10-29, from the `checker` review: the tub had tile to 84\" and no\nplumbing trim)\n\n- **Delta Foundations single-handle tub and shower set, B114900C-SS (stainless), valve\n  included.** About $119 (Home Depot).\n  - Link: https://www.homedepot.com/p/303669707\n  - Delta page: https://www.deltafaucet.com/bathroom/product/B114900C-SS.html\n  - Spec sheet: https://media.deltafaucet.com/SpecSheet/DSP-B-B112900C%20Rev%20C.pdf\n  - Specs: Monitor 14 pressure-balance valve, 7\" escutcheon, pull-up diverter spout (5-3/8\"),\n    5-1/2\" shower arm, 2-1/2\" 1.75 gpm head. The stainless finish reads as brushed nickel next\n    to the vanity knobs and the Kichler bar.\n  - Where: centered on the stub wall at the drain end. Valve at 30\", spout at 19\" (4\" over the\n    rim), shower arm at 80\".\n\n## Bath hardware\n\n**Status:** considering (placeholders in the model: any satin or brushed nickel)\n\n- **Towel bar, 18\"**, on the east wall at 48\", a step from the tub (the old 24\" bar on the stub\n  wall would sit over the new, taller vanity).\n- **Hand towel bar, 8\"**, on the stub wall's end beside the vanity, at 50\".\n- **Toilet paper holder**, on the east wall 9\" in front of the bowl, at 26\".\n- **Door:** the existing 6-panel door stays, with a lever.\n- **Base:** white 4\" painted base under the tile, as modeled.\n";
const slug = (t) => t.toLowerCase().replace(/<[^>]+>/g, "").replace(/[^a-z0-9 -]/g, "").trim().replace(/ +/g, "-");
marked.use({
  // links and images inside the room folder are written relative to it; this page sits in web/
  walkTokens(t) {
    if ((t.type === "link" || t.type === "image") && !/^([a-z]+:|#|\/)/i.test(t.href)) t.href = "../" + t.href;
  },
  renderer: {
    heading(text, level) { return `<h${level} id="${slug(text)}">${text}</h${level}>`; },
    link(href, title, text) {
      const ext = /^https?:/.test(href) ? ' target="_blank" rel="noopener"' : "";
      return `<a href="${href}"${ext}>${text}</a>`;
    },
  },
});
document.getElementById("doc").innerHTML = marked.parse(MD);
// pictures open larger in a popup
Lightbox.attach("#doc img");
// status words read as tags
document.querySelectorAll("#doc p strong, #doc li strong").forEach((s) => {
  if (s.textContent === "Status:") s.parentElement.classList.add("status");
});
</script>
