<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Renders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Home page: one section per house, a card per room (latest render + links). */
:root {
  --bg: #f3f1ec; --surface: #fbfaf7; --ink: #2a2522; --muted: #6f665e; --line: #ddd7cd; --accent: #8a5233;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #1c1916; --surface: #25211d; --ink: #eee8df; --muted: #a89d91; --line: #3a342e; --accent: #c98a5e; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #1c1916; --surface: #25211d; --ink: #eee8df; --muted: #a89d91; --line: #3a342e; --accent: #c98a5e; color-scheme: dark; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font: 700 1.6rem var(--font-display); margin: 0 0 4px; }
h2 { font: 700 1.15rem var(--font-display); margin: 36px 0 12px; }
.lede { color: var(--muted); margin: 0; max-width: 60ch; }
.rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 18px; }
.room { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: grid; }
.room img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: var(--line); }
.room div { padding: 12px 14px 14px; display: grid; gap: 4px; }
.room b { font-weight: 600; }
.room small { color: var(--muted); }
.room nav { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 4px; }
a { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Home Renders</h1>
  <p class="lede">Rooms modeled so far, by house. Open a walkthrough to look around in 3D and compare renders with the original photos.</p>

  <!-- one <h2> per house, one .room card per room (PROCESS.md, step 0). This page lives at
       houses/index.html, so links start at the house folder. Example:
  <h2>Our house</h2>
  <div class="rooms">
    <article class="room">
      <img src="ours/rooms/kitchen/renders/latest/day/photo1.jpg" alt="Kitchen, new design">
      <div>
        <b>Kitchen</b>
        <small>Modeled as it is today · design options next</small>
        <nav>
          <a href="ours/rooms/kitchen/web/index.html">Walkthrough</a>
          <a href="ours/rooms/kitchen/web/plans.html">Plans</a>
          <a href="ours/rooms/kitchen/web/selections.html">Selections</a>
        </nav>
      </div>
    </article>
  </div>
  -->
</main>
</body>
</html>
