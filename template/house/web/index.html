<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../../lib/web/walkthrough.css">
<link rel="stylesheet" href="../../../lib/web/housemap.css">
</head>
<body data-view="plan">
<header>
  <nav class="crumbs" aria-label="Breadcrumb">
    <a href="../../../index.html">All rooms</a><span>/</span><b>HOUSE NAME</b>
  </nav>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="plan">Plan</button>
    <button role="tab" aria-selected="false" data-tab="3d">3D</button>
  </div>
</header>

<main>
  <section id="map">
    <div class="map-tools">
      <div class="seg" id="floors" role="group" aria-label="Floor"></div>
      <label id="plan-tools"><input type="checkbox" id="show-plan"> Listing plan underneath</label>
    </div>
    <div id="plan"></div>
    <div id="dollhouse" hidden></div>
  </section>
  <aside>
    <div id="detail"></div>
    <div class="legend">
      <span><i class="dot modeled"></i>Modeled</span>
      <span><i class="dot"></i>Placeholder</span>
      <span><i class="dot closet"></i>Closet</span>
      <span><i class="dot stairs"></i>Stairs</span>
    </div>
    <div id="room-list"></div>
  </aside>
</main>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script src="house.js"></script>   <!-- rooms, from house_layout.py via lib/tools/house_map.py -->
<script src="../../../lib/web/housemap.js"></script>
</body>
</html>
